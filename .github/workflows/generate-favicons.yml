name: Generate favicon PNGs and ICO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Render PNGs from favicon.svg
        run: |
          rsvg-convert -w 16 -h 16 favicon.svg -o favicon-16x16.png
          rsvg-convert -w 32 -h 32 favicon.svg -o favicon-32x32.png
          rsvg-convert -w 180 -h 180 favicon.svg -o apple-touch-icon.png
          rsvg-convert -w 192 -h 192 favicon.svg -o android-chrome-192x192.png
          rsvg-convert -w 512 -h 512 favicon.svg -o favicon-512x512.png
          python3 -c "from PIL import Image; Image.open('favicon-32x32.png').save('favicon.ico', sizes=[(16, 16), (32, 32)])"
          ls -l favicon* apple-touch-icon.png android-chrome-192x192.png
      - name: Commit generated favicons
        run: |
          git config user.name "zeeshanshabbir-ai"
          git config user.email "zeeshanshabbir-ai@users.noreply.github.com"
          git add favicon-16x16.png favicon-32x32.png apple-touch-icon.png android-chrome-192x192.png favicon-512x512.png favicon.ico
          git diff --cached --quiet || git commit -m "Add generated favicon PNGs and ICO from favicon.svg"
          git push
